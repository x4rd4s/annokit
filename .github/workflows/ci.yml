# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds and tests on Linux and Windows for every pull request and push; macOS runners are often
# not available for a long time, so the macOS jobs run once a week and on a manual run
# (Actions > CI > Run workflow). They reuse the steps of the other jobs (YAML anchors).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC: keeps the macOS build checked
  workflow_dispatch:

# Actions are pinned to commit SHAs (the tag in the comment); Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cc compiles the C libraries, cxx the rest: both from the same compiler, so that a
        # sanitizer job links one runtime.
        include:
          - { name: Linux GCC,     os: ubuntu-24.04, cc: gcc,   cxx: g++,     preset: ci }
          - { name: Linux Clang,   os: ubuntu-24.04, cc: clang, cxx: clang++, preset: ci }
          - { name: Linux ASan,    os: ubuntu-24.04, cc: clang, cxx: clang++, preset: asan }
          - { name: Linux TSan,    os: ubuntu-24.04, cc: clang, cxx: clang++, preset: tsan }
          - { name: Windows MSVC,  os: windows-2025, cc: cl,    cxx: cl,      preset: ci }
          - { name: Windows Debug, os: windows-2025, cc: cl,    cxx: cl,      preset: debug }
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        timeout-minutes: 35
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh ninja-build zlib1g-dev

      - name: Install dependencies (macOS)
        timeout-minutes: 35
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/zlib" ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0  # report every failing file at once

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  platform:
    name: Platform (SDL3, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,      os: ubuntu-24.04, preset: ci }
          - { name: Linux ASan, os: ubuntu-24.04, preset: asan }
          - { name: Windows,    os: windows-2025, preset: ci }
    env: &platform-env
      SDL_VERSION: 3.2.24
    steps: &platform-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        timeout-minutes: 35
        if: runner.os == 'Linux'
        run: >
          .github/scripts/apt-install.sh ninja-build zlib1g-dev libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols
          libegl1-mesa-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        timeout-minutes: 35
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ matrix.os }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DANNOKIT_BUILD_PLATFORM=ON
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3;${{ runner.temp }}/zlib"
          ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      # The other tests run in the build job; here the SDL layer's, on SDL's dummy drivers.
      - name: Test the SDL layer
        run: ctest --preset ${{ matrix.preset }} -R "^sdl$"

  # The macOS jobs: the same steps as above, only on the weekly and manual runs (see the top).
  build-macos:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Clang, os: macos-15, cc: clang, cxx: clang++, preset: ci }
    steps: *build-steps

  platform-macos:
    name: Platform (SDL3, ${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15, preset: ci }
    env: *platform-env
    steps: *platform-steps

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        timeout-minutes: 35
        run: >
          .github/scripts/apt-install.sh clang-18 clang-tidy-18 ninja-build zlib1g-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev
          libxkbcommon-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-24.04

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      # Only the compile commands: clang-tidy parses the sources itself (checks in .clang-tidy).
      - name: Configure
        run: >
          cmake --preset ci -DANNOKIT_BUILD_PLATFORM=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3"

      - name: clang-tidy (modules)
        run: |
          clang-tidy-18 --version
          run-clang-tidy-18 -quiet -j "$(nproc)" -clang-tidy-binary clang-tidy-18 -p build/ci "$PWD/modules/"

  checks:
    name: Formatting and cleanliness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install clang-format 18
        timeout-minutes: 35
        run: .github/scripts/apt-install.sh clang-format-18
      - name: Check formatting
        # Called by its versioned name so that a runner image with another default version cannot
        # reformat the code.
        run: |
          clang-format-18 --version
          find modules tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Check the repository stays game-independent
        run: python3 -I tools/check_clean.py
